# Blueprint do Render: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: reci-checker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # 1 worker (os trabalhos ficam em memória) + threads; --timeout alto porque o envio é assíncrono mas o arquivo pode ser grande
    startCommand: gunicorn --chdir web app:app --workers 1 --threads 4 --timeout 300 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SITE_PASSWORD      # defina no painel do Render: senha de acesso ao site (usuário: reci)
        sync: false
